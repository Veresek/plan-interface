services:
  server:
    build:
      context: ./server
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    environment:
      SCHEDULE_BASE_URL: https://plan.zs1mm.edu.pl/nauczycielezs1/
      SCHEDULES_URL: https://plan.zs1mm.edu.pl/nauczycielezs1/lista.html
    volumes:
      - server-data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: ./Dockerfile
      args:
        API_URL: ${API_URL:-http://server:3000}
    depends_on:
      - server
    ports:
      - "3001:3000"
    environment:
      API_URL: ${API_URL:-http://server:3000}
    restart: unless-stopped

volumes:
  server-data:
