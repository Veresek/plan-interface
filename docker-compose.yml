services:
  server:
    build:
      context: ./server
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    environment:
      SCHEDULE_BASE_URL: https://plan.zs1mm.edu.pl/nauczycielezs1/
      SCHEDULES_URL: https://plan.zs1mm.edu.pl/nauczycielezs1/lista.html
    volumes:
      - server-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 36
      # startup runs a full scrape of the schedule site before listening
      start_period: 60s
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: ./Dockerfile
      args:
        API_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      API_URL: http://server:3000
    restart: unless-stopped

volumes:
  server-data:
